[build-system]
requires = ["uv_build>=0.9.0,<0.10.0"]
build-backend = "uv_build"

[project]
name = "uijudge-bench"
version = "0.1.0"
description = "A paper-rigor benchmark for AI judges of web UI quality (accessibility, layout, referring, design)."
readme = "README.md"
license = "MIT"
authors = [
    {name = "Gaurav Sood", email = "contact@gsood.com"}
]
keywords = [
    "benchmark",
    "accessibility",
    "wcag",
    "ui testing",
    "llm-as-a-judge",
    "layout",
    "web",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Testing",
    "Topic :: Scientific/Engineering",
    "Operating System :: OS Independent",
]
requires-python = ">=3.11"
dependencies = [
    "playwright>=1.40.0",
    "litellm>=1.80.0",
    "httpx>=0.27.0",
    "beautifulsoup4>=4.12.0",
]

[project.optional-dependencies]
# LayoutLens-backed judge adapter (uijudge.harness.judges.layoutlens_judge). Optional: the
# core bench never imports layoutlens. Requires the v1.8 faithful judge() interface; until
# 1.8.0 is on PyPI, install locally with `uv pip install -e ../layoutlens`.
judge = ["layoutlens>=1.8.0"]

[project.urls]
"Homepage" = "https://github.com/gojiplus/uijudge-bench"
"Source" = "https://github.com/gojiplus/uijudge-bench"
"Bug Reports" = "https://github.com/gojiplus/uijudge-bench/issues"

[dependency-groups]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "jsonschema>=4.0.0",
    "ruff>=0.7.0",
]

[tool.uv]
# The optional `judge` extra requires layoutlens>=1.8.0 (the faithful judge() interface),
# but PyPI currently tops out at 1.7.0, so uv's universal lock would be unsatisfiable. Relax
# the constraint LOCALLY so `uv sync`/`uv run` work; the published package metadata still
# advertises >=1.8.0 for pip consumers. Local dev installs the real interface out-of-band
# (`uv pip install -e ../layoutlens`), and the judge tests skip unless LayoutLens.judge exists.
# REMOVE this override once layoutlens 1.8.0 is on PyPI.
override-dependencies = ["layoutlens>=1.7.0"]

[tool.uv.build-backend]
module-root = ""
module-name = "uijudge"

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
asyncio_mode = "auto"
addopts = [
    "-v",
    "--tb=short",
    "--strict-markers",
    "--strict-config",
]
markers = [
    "browser: Tests that launch a real chromium browser (require playwright install)",
    "network: Tests that require network access",
]
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::PendingDeprecationWarning",
]

[tool.ruff]
line-length = 120
target-version = "py311"
include = ["*.py", "*.pyi"]
exclude = [
    ".git",
    "__pycache__",
    "build",
    "dist",
    "*.egg-info",
    ".venv",
    "venv",
    "corpus",
    ".superpowers",
]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "SIM", # flake8-simplify
]
ignore = [
    "E203",  # whitespace before ':'
    "E501",  # line too long (handled by line-length)
    "F541",  # f-string is missing placeholders
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
"test_*.py" = ["F841"]

[tool.ruff.lint.isort]
known-first-party = ["uijudge"]
