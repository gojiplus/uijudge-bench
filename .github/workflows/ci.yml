name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  LITELLM_LOCAL_MODEL_COST_MAP: "True"

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.12.5"

      - name: Set up Python
        run: uv python install 3.11

      - name: Check lockfile
        run: uv lock --check

      - name: Install dependencies
        run: uv sync --locked --group dev --python 3.11

      - name: Ruff check
        run: uv run ruff check uijudge/ tests/

      - name: Ruff format check
        run: uv run ruff format --check uijudge/ tests/

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12', '3.13', '3.14']
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.12.5"

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --locked --group dev --python ${{ matrix.python-version }}

      - name: Install Playwright chromium
        run: uv run playwright install chromium --with-deps

      - name: Run tests (offline + browser-marked)
        run: uv run pytest -v

  package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.12.5"

      - name: Set up Python
        run: uv python install 3.11

      - name: Build distributions
        run: uv build

      - name: Validate distribution metadata
        run: uvx --from twine==7.0.0 twine check dist/*

      - name: Install wheel in an isolated environment
        run: |
          uv venv "${{ runner.temp }}/uijudge-package-smoke" --python 3.11
          uv pip install --python "${{ runner.temp }}/uijudge-package-smoke/bin/python" dist/*.whl

      - name: Smoke test installed wheel
        working-directory: ${{ runner.temp }}
        run: >-
          "${{ runner.temp }}/uijudge-package-smoke/bin/python" -c
          'import importlib.metadata as metadata; import uijudge;
          assert uijudge.__version__ == metadata.version("uijudge-bench");
          print(f"uijudge-bench {uijudge.__version__}")'
